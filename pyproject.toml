[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes"
version = "0.1.0"
description = "HERMES network monitoring and anomaly detection pipeline"
# 3.14 is the real floor, not just the deployment target. [tool.ruff]
# target-version = "py314" means `ruff format` emits PEP 758 syntax
# (`except ValueError, IndexError:` without parentheses), which does not parse on
# 3.11-3.13. Dockerfile is python:3.14-slim and ci.yml pins 3.14, so the toolchain
# is coherent at 3.14 and only at 3.14.
#
# This was briefly lowered to ">=3.11" on the grounds that datetime.UTC is the only
# hard requirement and the suite passes on 3.11. That was wrong: it ignored the
# formatter, which actively rewrites the source into 3.14-only syntax.
requires-python = ">=3.14"
dependencies = [
    "google-cloud-bigquery>=3.43.0",
    # Arrow-based download path for tomography. WITHOUT this, the client logs
    # "Storage Read API unavailable ... using REST download" and builds result
    # frames from JSON rows instead of Arrow buffers. That is both far slower
    # (13.7M node-edge rows took 19.5 min on 2025-08-01) and far heavier: the
    # retained frame plus Phase 4's allocations OOM-killed the worker at 22.1 GB
    # inside a 28 GB cgroup, failing the whole 2025-08 backfill chunk.
    # pyarrow is the wire format for that path — pin it here rather than relying
    # on it arriving transitively via pandas/db-dtypes.
    "google-cloud-bigquery-storage>=2.40.0",
    "pyarrow>=25.0.0",
    "db-dtypes>=1.7.1",  # required by bigquery .to_dataframe() for DATE/TIME columns (download_edges)
    "google-auth>=2.56.3",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "geopy>=2.5.0",
    "tqdm>=4.70.0",
    "maxminddb>=3.1.1",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "wget>=3.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.11.1", "geopandas>=1.1.4", "folium>=0.20.0"]
dev = ["ruff>=0.16.2", "mypy>=2.3.0", "pytest>=9.1.1", "pre-commit>=4.6.1", "pandas-stubs", "types-requests", "pyarrow>=25.0.0"]

[project.scripts]
hermes-pipeline = "hermes.pipeline.union:main"
hermes-tomography = "hermes.pipeline.correlation_tomography:main"
hermes-budget = "hermes.pipeline.budget:main"
hermes-refresh-topology = "hermes.pipeline.refresh_topology_tables:main"
hermes-table-rerun = "hermes.pipeline.table_rerun:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]
# .sql assets under src/hermes/sql/** are shipped automatically as package data
# (they live inside the package). Do NOT add a force-include for them — that
# duplicates the files and fails the wheel build with "A second file is being
# added to the wheel archive at the same path".

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Legacy code moved from hermes_enrichment/ — long strings/log messages/SQL
# that can't be broken without semantic changes; deferring to Task 14 cleanup.
"src/hermes/enrichment/**/*.py" = ["E501"]
# Legacy pipeline scripts — long SQL table/field names and argparse help strings.
"src/hermes/pipeline/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
files = ["src/hermes"]

# Legacy enrichment modules moved from hermes_enrichment/ — have implicit Optional,
# untyped module-level dicts, maxminddb union-attr noise, and enricher class
# inheritance mismatches.  Full typing pass deferred to Task 14.
[[tool.mypy.overrides]]
module = [
    "hermes.enrichment.as_metadata.enricher",
    "hermes.enrichment.as_metadata.inetintel_downloader",
    "hermes.enrichment.hoiho.enricher",
    "hermes.enrichment.hoiho.enricher_ipv6",
    "hermes.enrichment.ipinfo.enricher",
    "hermes.enrichment.ipinfo.enricher_ipv6",
    "hermes.enrichment.main",
    "hermes.enrichment.peeringdb_ixp.ixp_collector",
    "hermes.enrichment.ripe_ipmap.enricher",
    "hermes.enrichment.ripe_ipmap.enricher_ipv6",
    "hermes.enrichment.routeviews.enricher_ipv6",
]
ignore_errors = true

# Fully-typed new modules — enforce strict untyped-def checking.
[[tool.mypy.overrides]]
module = [
    "hermes.sql.paths",
    "hermes.sql.loader",
    "hermes.pipeline.tomography",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = ["bq: tests that require BigQuery credentials (on-demand only)"]
